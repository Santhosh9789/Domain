name: Build and Deploy Blueidealteck 3D Website

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Permissions for official GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent race conditions by cancelling in-progress runs
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Upload Pages Artifact (Ultra Fast 5s Deploy)
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
